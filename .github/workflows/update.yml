name: Update IPTV

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update playlists
        run: python scripts/update.py

      - name: Commit generated files
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add cctv.m3u province.m3u live.m3u selene-sub.txt
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Auto update IPTV playlists"
          git push


      - name: Sync generated files to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN is not configured; skip Gitee sync."
            exit 0
          fi

          rm -rf /tmp/selene-iptv-gitee
          git clone "https://daoshengtianxia:${GITEE_TOKEN}@gitee.com/daoshengtianxia/selene-iptv.git" /tmp/selene-iptv-gitee
          cp cctv.m3u province.m3u live.m3u selene-sub.txt /tmp/selene-iptv-gitee/

          cd /tmp/selene-iptv-gitee
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add cctv.m3u province.m3u live.m3u selene-sub.txt

          if git diff --cached --quiet; then
            echo "Gitee files are already up to date."
            exit 0
          fi

          git commit -m "Auto sync IPTV playlists from GitHub"
          git push origin main
